  code { word-break: break-all; } input[type=text], textarea { width: 100%; box-sizing: border-box; padding: .4rem; } button { padding: .5rem 1rem; margin-top: .4rem; }
</style>
</head>
<body>
  <h1 id="pageTitle"></h1>
  <div id="statusBox" class="box"></div>
  <div id="orderBox" class="box" hidden></div>
  <div id="credentialBox" class="box" hidden></div>
  <div id="deliveryBox" class="box" hidden></div>
  <div id="pasteBox" class="box" hidden></div>
  <div id="refundBox" class="box" hidden></div>
  <div id="sweepBox" class="box" hidden></div>
  <script type="module" src="./delivery-page.js"></script>
</body>
